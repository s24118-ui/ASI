name: Kedro integration diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kedro-environment:
    name: Lightweight Kedro validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source without Git LFS
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install integration dependencies without AutoML
        shell: bash
        run: |
          grep -v -E '^autogluon' requirements.txt > /tmp/requirements-integration.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements-integration.txt
          python -m pip install -e .

      - name: Check Kedro installation
        run: kedro --version

      - name: List registered pipelines
        run: kedro registry list

      - name: Validate catalog visibility (diagnostic)
        continue-on-error: true
        run: kedro catalog list

      - name: Detect a small CSV integration fixture
        id: fixture
        shell: bash
        run: |
          fixture="$(find tests -type f -name '*.csv' -size -5M -print -quit)"
          if [[ -n "$fixture" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$fixture" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run data-processing pipeline on the small fixture
        if: steps.fixture.outputs.found == 'true'
        shell: bash
        run: |
          cp "${{ steps.fixture.outputs.path }}" data/01_raw/credit_score.csv
          kedro run --pipeline=data_processing

      - name: Write integration summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Kedro integration diagnostics"
            echo
            echo "- Git LFS, baseline training and AutoML were not run."
            if [[ "${{ steps.fixture.outputs.found }}" == "true" ]]; then
              echo "- The data-processing pipeline used fixture: \`${{ steps.fixture.outputs.path }}\`."
            else
              echo "- No small CSV fixture exists under \`tests/\`; a full integration test requires a small representative fixture and must not use the production dataset."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

