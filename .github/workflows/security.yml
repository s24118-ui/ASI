name: Security

on:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      pull-requests: read

    steps:
      - name: Check out source without Git LFS
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze Python
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out source without Git LFS
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      # Availability depends on the repository visibility and GitHub security settings.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

